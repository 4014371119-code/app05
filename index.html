<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- 嚴格遵守原生 App 視窗防縮放與安全區域設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="海綿寶寶圖鑑" />
  <meta name="theme-color" content="#eab308" id="meta-theme-color" />
  <title>比奇堡圖鑑：海綿寶寶角色介紹</title>

  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Noto Sans TC & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* 全域原生 App 互動與防誤觸設定 */
    * {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    /* 安全區域留白適配 */
    .safe-top {
      padding-top: max(1rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }

    /* 按壓觸動回饋 */
    .press-feedback {
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.15s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .press-feedback:active {
      transform: scale(0.95);
      opacity: 0.9;
    }

    /* 毛玻璃質感 */
    .glass-panel {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* 海底氣泡漂浮微動畫 */
    @keyframes floatBubble {
      0% {
        transform: translateY(0) scale(0.9);
        opacity: 0;
      }
      20% {
        opacity: 0.65;
      }
      80% {
        opacity: 0.55;
      }
      100% {
        transform: translateY(-230px) scale(1.15);
        opacity: 0;
      }
    }

    .bubble {
      position: absolute;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.25) 60%, rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.55);
      pointer-events: none;
      animation: floatBubble var(--dur, 5s) ease-in infinite;
      animation-delay: var(--delay, 0s);
    }

    /* 角色主視覺懸浮呼吸動畫 */
    @keyframes characterFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-7px) rotate(1.2deg);
      }
    }

    .character-float {
      animation: characterFloat 3.8s ease-in-out infinite;
    }

    /* 卡片切換過渡動畫 */
    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-card-enter {
      animation: cardEnter 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="bg-sky-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <!-- 中央角色展示與檔案卡片（支援左右滑動 Swipe 手勢） -->

          <!-- 海底氣泡動態層 -->

          <!-- 左上角編號徽章 -->

          <!-- 底部波浪過渡遮罩 -->
          <svg class="absolute bottom-0 left-0 w-full h-6 text-white/85 dark:text-slate-900/85 fill-current transition-colors duration-300" viewBox="0 0 1440 74" preserveAspectRatio="none">

      <button id="next-btn" type="button" class="press-feedback flex-1 py-3 px-4 rounded-2xl shadow-md flex items-center justify-center gap-1.5 text-sm font-extrabold text-slate-950 transition-colors duration-300 bg-yellow-400">

  <script>
    /**
     * ============================================================================
     * 1. PWA 核心規範實作：動態產生 App Icon Data URI、Manifest Blob URL 與 Service Worker
     * ============================================================================
     */
    (function initPWA() {
      // 極簡可愛的「海綿寶寶黃色方塊笑臉」SVG 圖示
      const appIconSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="112" fill="url(#bg)"/>
          <rect x="86" y="76" width="340" height="310" rx="54" fill="#facc15" stroke="#854d0e" stroke-width="14"/>
          <circle cx="135" cy="130" r="18" fill="#ca8a04" opacity="0.55"/>
          <circle cx="375" cy="145" r="14" fill="#ca8a04" opacity="0.55"/>
          <circle cx="128" cy="320" r="15" fill="#ca8a04" opacity="0.55"/>
          <circle cx="380" cy="310" r="18" fill="#ca8a04" opacity="0.55"/>
          <circle cx="205" cy="205" r="42" fill="#ffffff" stroke="#1e293b" stroke-width="10"/>
          <circle cx="307" cy="205" r="42" fill="#ffffff" stroke="#1e293b" stroke-width="10"/>
          <circle cx="212" cy="205" r="17" fill="#0284c7"/>
          <circle cx="300" cy="205" r="17" fill="#0284c7"/>
          <circle cx="216" cy="200" r="6" fill="#ffffff"/>
          <circle cx="304" cy="200" r="6" fill="#ffffff"/>
          <path d="M175 278 Q256 342 337 278" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
          <rect x="224" y="302" width="26" height="28" rx="5" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
          <rect x="262" y="302" width="26" height="28" rx="5" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>
          <rect x="86" y="354" width="340" height="44" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="10"/>
          <polygon points="256,360 238,395 256,435 274,395" fill="#ef4444" stroke="#1e293b" stroke-width="8"/>
        </svg>
      `.trim();

      const iconDataUri = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(appIconSvg);

      // 動態注入 favicon 與 apple-touch-icon
      const linkIcon = document.createElement("link");
      linkIcon.rel = "icon";
      linkIcon.type = "image/svg+xml";
      linkIcon.href = iconDataUri;
      document.head.appendChild(linkIcon);

      const appleIcon = document.createElement("link");
      appleIcon.rel = "apple-touch-icon";
      appleIcon.href = iconDataUri;
      document.head.appendChild(appleIcon);

      // 動態產生 Web App Manifest Blob URL
      const manifestData = {
        name: "比奇堡角色圖鑑 Pro",
        short_name: "海綿寶寶圖鑑",
        description: "比奇堡經典角色互動圖鑑，支援離線瀏覽與原生滑動手勢體驗。",
        display: "standalone",
        orientation: "portrait",
        start_url: "./",
        background_color: "#0284c7",
        theme_color: "#eab308",
        icons: [
          {
            src: iconDataUri,
            sizes: "512x512",
            type: "image/svg+xml",
            purpose: "any maskable"
          }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: "application/manifest+json" });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      const manifestLink = document.createElement("link");
      manifestLink.rel = "manifest";
      manifestLink.href = manifestUrl;
      document.head.appendChild(manifestLink);

      // 動態註冊內聯 Service Worker 實現離線快取
      if ("serviceWorker" in navigator) {
        const swCode = `
          const CACHE_NAME = 'bikini-bottom-dex-v1';
          self.addEventListener('install', (event) => {
            self.skipWaiting();
            event.waitUntil(
              caches.open(CACHE_NAME).then((cache) => {
                return cache.addAll(['./']).catch(() => {});
              })
            );
          });
          self.addEventListener('activate', (event) => {
            event.waitUntil(self.clients.claim());
          });
          self.addEventListener('fetch', (event) => {
            if (event.request.method !== 'GET') return;
            event.respondWith(
              caches.match(event.request).then((cachedResponse) => {
                const fetchPromise = fetch(event.request).then((networkResponse) => {
                  if (networkResponse && networkResponse.status === 200) {
                    const responseClone = networkResponse.clone();
                    caches.open(CACHE_NAME).then((cache) => {
                      cache.put(event.request, responseClone);
                    });
                  }
                  return networkResponse;
                }).catch(() => cachedResponse);
                return cachedResponse || fetchPromise;
              })
            );
          });
        `;
        try {
          const swBlob = new Blob([swCode], { type: "application/javascript" });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch(() => {
            // 預覽沙盒環境若限制 Blob SW 註冊則靜默降級，不影響主功能
          });
        } catch (e) {}
      }

      // 監聽 PWA 安裝提示事件
      let deferredPrompt = null;
      const installBtn = document.getElementById("install-pwa-btn");
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.classList.remove("hidden");
      });

      if (installBtn) {
        installBtn.addEventListener("click", async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          installBtn.classList.add("hidden");
        });
      }
    })();

    /**
     * ============================================================================
     * 2. 四位經典角色資料與純手工繪製 Inline SVG 矢量插畫
     * ============================================================================
     */
    const CHARACTERS = [
      {
        id: "spongebob",
        number: "01",
        name: "海綿寶寶",
        enName: "SpongeBob SquarePants",

    let currentIndex = 0;
    let isDarkMode = false;

    // 讀取使用者先前的偏好設定
    function loadSavedPreferences() {
      try {
        const savedIndex = localStorage.getItem(STORAGE_KEYS.CHAR_INDEX);
        if (savedIndex !== null) {
          const parsed = parseInt(savedIndex, 10);
          if (!isNaN(parsed) && parsed >= 0 && parsed < CHARACTERS.length) {
            currentIndex = parsed;
          }
        }

        const savedTheme = localStorage.getItem(STORAGE_KEYS.DARK_MODE);
        if (savedTheme !== null) {
          isDarkMode = savedTheme === "true";
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          isDarkMode = true;
        }
      } catch (e) {}
    }

    function applyThemeMode(dark) {
      isDarkMode = dark;
      const htmlEl = document.documentElement;
      if (dark) {
        htmlEl.classList.add("dark");
      } else {
        htmlEl.classList.remove("dark");
      }
      try {
        localStorage.setItem(STORAGE_KEYS.DARK_MODE, String(dark));
      } catch (e) {}
    }

    /**
     * ============================================================================
     * 4. UI 渲染、氣泡微動畫產生與角色切換控制
     * ============================================================================
     */
    function generateBubbles() {
      const container = document.getElementById("bubbles-layer");
      if (!container) return;
      container.innerHTML = "";
      const bubbleConfigs = [
        { left: "12%", size: 14, dur: "4.8s", delay: "0s" },
        { left: "26%", size: 9, dur: "3.9s", delay: "1.2s" },
        { left: "44%", size: 16, dur: "5.4s", delay: "2.1s" },
        { left: "68%", size: 11, dur: "4.2s", delay: "0.7s" },
        { left: "82%", size: 15, dur: "5.0s", delay: "1.8s" },
        { left: "90%", size: 8, dur: "3.6s", delay: "2.8s" }
      ];

      bubbleConfigs.forEach((b) => {
        const el = document.createElement("span");
        el.className = "bubble";
        el.style.left = b.left;
        el.style.bottom = "-20px";
        el.style.width = `${b.size}px`;
        el.style.height = `${b.size}px`;
        el.style.setProperty("--dur", b.dur);
        el.style.setProperty("--delay", b.delay);
        container.appendChild(el);
      });
    }

    function renderCharacter(index, triggerAnimation = true) {
      currentIndex = (index + CHARACTERS.length) % CHARACTERS.length;
      const char = CHARACTERS[currentIndex];

      // 儲存最新瀏覽的角色索引
      try {
        localStorage.setItem(STORAGE_KEYS.CHAR_INDEX, String(currentIndex));
      } catch (e) {}

      // 更新動態主題光暈與 meta theme-color
      const ambientBg = document.getElementById("ambient-bg");
      if (ambientBg) ambientBg.style.background = char.theme.ambientGlow;

      const metaTheme = document.getElementById("meta-theme-color");
      if (metaTheme) metaTheme.setAttribute("content", char.theme.primaryHex);

      // 更新頂部 Tab 指示器位置與顏色
      const indicator = document.getElementById("tab-indicator");
      if (indicator) {
        indicator.style.left = `calc(${currentIndex * 25}% + 6px)`;
        indicator.style.backgroundColor = char.theme.primaryHex;
      }

      const tabButtons = document.querySelectorAll(".tab-btn");
      tabButtons.forEach((btn, idx) => {
        if (idx === currentIndex) {
          btn.classList.remove("text-slate-600", "dark:text-slate-300", "text-slate-900", "text-white");
          btn.classList.add(char.theme.btnTextClass);
        } else {
          btn.classList.remove("text-slate-900", "text-slate-950", "text-white");
          btn.classList.add("text-slate-600", "dark:text-slate-300");
        }
      });

      // 更新主視覺漸層與 SVG 插畫
      const heroStage = document.getElementById("hero-stage");
      if (heroStage) heroStage.style.background = char.theme.stageGradient;

      const svgContainer = document.getElementById("svg-illustration-container");
      if (svgContainer) svgContainer.innerHTML = char.svg;

      // 更新角色資訊文字
      document.getElementById("char-number").textContent = char.number;
      document.getElementById("char-home-icon").textContent = char.homeIcon;
      document.getElementById("char-home").textContent = char.home;
      document.getElementById("char-name").textContent = char.name;
      document.getElementById("char-en-name").textContent = char.enName;
      document.getElementById("char-description").textContent = char.description;

      // 更新職業標籤樣式
      const roleBadge = document.getElementById("char-role-badge");
      roleBadge.textContent = char.role;
      roleBadge.className = `px-3.5 py-1.5 rounded-2xl text-xs font-extrabold shadow-sm transition-colors duration-300 ${char.theme.btnBgClass} ${char.theme.btnTextClass}`;

      // 更新性格關鍵字標籤
      const traitsContainer = document.getElementById("char-traits");
      traitsContainer.innerHTML = char.traits
        .map(
          (trait) =>
            `<span class="px-2.5 py-1 rounded-xl text-xs font-bold bg-slate-200/75 dark:bg-slate-800 text-slate-700 dark:text-slate-300"># ${trait}</span>`
        )
        .join("");

      // 更新底部圓點與「下一位」按鈕顏色
      const dots = document.querySelectorAll("#dots-indicator .dot");
      dots.forEach((dot, idx) => {
        if (idx === currentIndex) {
          dot.style.backgroundColor = char.theme.primaryHex;
          dot.classList.add("w-5", "scale-110");
          dot.classList.remove("w-2", "bg-slate-400/50");
        } else {
          dot.style.backgroundColor = "";
          dot.classList.remove("w-5", "scale-110");
          dot.classList.add("w-2", "bg-slate-400/50");
        }
      });

      const nextBtn = document.getElementById("next-btn");
      if (nextBtn) {
        nextBtn.className = `press-feedback flex-1 py-3 px-4 rounded-2xl shadow-md flex items-center justify-center gap-1.5 text-sm font-extrabold transition-colors duration-300 ${char.theme.btnBgClass} ${char.theme.btnTextClass}`;
      }

      // 觸發卡片進場微動畫與輕微觸覺震動回饋（若裝置支援）
      if (triggerAnimation) {
        const cardContent = document.getElementById("card-content");
        cardContent.classList.remove("animate-card-enter");
        void cardContent.offsetWidth; // 強制 reflow 重新觸發動畫
        cardContent.classList.add("animate-card-enter");

        if (navigator.vibrate) {
          try {
            navigator.vibrate(12);
          } catch (e) {}
        }
      }
    }

    /**
     * ============================================================================
     * 5. 事件監聽：Tab 點擊、左右按鈕、鍵盤方向鍵與觸控左右滑動手勢（Swipe）
     * ============================================================================
     */
    function bindEvents() {
      // 4 格角色 Tab 點擊
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-index"), 10);
          if (idx !== currentIndex) {
            renderCharacter(idx, true);
          }
        });
      });

      // 上一位 / 下一位按鈕
      document.getElementById("prev-btn").addEventListener("click", () => {
        renderCharacter(currentIndex - 1, true);
      });
      document.getElementById("next-btn").addEventListener("click", () => {
        renderCharacter(currentIndex + 1, true);
      });

      // 深色/淺色主題切換
      document.getElementById("theme-toggle-btn").addEventListener("click", () => {
        applyThemeMode(!isDarkMode);
        if (navigator.vibrate) {
          try {
            navigator.vibrate(10);
          } catch (e) {}
        }
      });

      // 鍵盤左右方向鍵支援
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          renderCharacter(currentIndex - 1, true);
        } else if (e.key === "ArrowRight") {
          renderCharacter(currentIndex + 1, true);
        }
      });

      // 觸控左右滑動手勢（Swipe）偵測
      const swipeArea = document.getElementById("swipe-area");
      let touchStartX = 0;
      let touchStartY = 0;

      swipeArea.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        },
        { passive: true }
      );

      swipeArea.addEventListener(
        "touchend",
        (e) => {
          if (e.changedTouches.length === 1) {
            const deltaX = e.changedTouches[0].clientX - touchStartX;
            const deltaY = e.changedTouches[0].clientY - touchStartY;

            // 確保水平滑動距離大於垂直滑動，且超過 42px 閾值
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 42) {
              if (deltaX < 0) {
                renderCharacter(currentIndex + 1, true); // 向左滑 -> 下一位
              } else {
                renderCharacter(currentIndex - 1, true); // 向右滑 -> 上一位
              }
            }
          }
        },
        { passive: true }
      );
    }

    // 初始化應用程式
    document.addEventListener("DOMContentLoaded", () => {
      loadSavedPreferences();
      applyThemeMode(isDarkMode);
      generateBubbles();
      bindEvents();
      renderCharacter(currentIndex, false);
    });
  </script>
</body>
</html>
